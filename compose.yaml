# Synology Container Manager → Project → Create → paste this file.
# Put dashboard.json (copied from config/dashboard.example.json) in ./config
# and HA_TOKEN in a .env file next to this one (never commit it).
services:
  home-dashboard:
    build: .
    image: home-dashboard:latest
    container_name: home-dashboard
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      HA_URL: ${HA_URL:-http://homeassistant.local:8123}
      HA_TOKEN: ${HA_TOKEN:?set HA_TOKEN in .env}
      ACCESS_KEY: ${ACCESS_KEY:-}
      TZ: ${TZ:-America/Chicago}
    volumes:
      - ./config:/config:ro
